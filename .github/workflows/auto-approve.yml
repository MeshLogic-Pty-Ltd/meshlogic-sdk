name: Auto Approve PRs

# Triggers after the gating CI workflow(s) complete on a PR.
# Uses the meshlogic-ci-dependency-access GitHub App to approve,
# since the app is a distinct identity from the PR author.
#
# SECURITY: skips PRs that touch sensitive paths (workflows + policy).
# Those changes must be approved by a human, not the bot — otherwise a
# write-perm contributor could self-merge .github/workflows/ changes
# (re-introducing the supply-chain risk that the SHA pin in
# ai-review.yml exists to prevent).
on:
  workflow_run:
    workflows: ["Go SDK", "Python SDK", "TypeScript SDK"]
    types: [completed]

# Only one auto-approve per PR at a time — prevents cascade pile-up
concurrency:
  group: auto-approve-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-approve:
    name: Auto Approve (CI Passed)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.event.workflow_run.repository.full_name
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: MeshLogic-Pty-Ltd

      - name: Find and approve PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests;

            if (!prs || prs.length === 0) {
              console.log('No PRs associated with this workflow run');
              return;
            }

            const prNumber = prs[0].number;

            // Security: verify PR author is an org member (blocks fork PR attacks)
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const author = pr.user.login;
            // Verify author has write+ access to this repo (covers org members and collaborators).
            // Uses repos scope (already granted) instead of org:members:read.
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              const allowed = ['admin', 'maintain', 'write'];
              if (!allowed.includes(perm.permission)) {
                console.log(`PR #${prNumber} author ${author} has '${perm.permission}' permission — skipping auto-approve`);
                return;
              }
            } catch (e) {
              const status = e.status || 'unknown';
              const message = e.message || 'no details';
              console.log(`PR #${prNumber} — collaborator check failed for ${author} (HTTP ${status}: ${message}). Skipping auto-approve.`);
              return;
            }

            // SECURITY: paginate listFiles and skip auto-approve on PRs that
            // touch sensitive paths. Without paginate, large PRs (>30 files)
            // would silently miss sensitive files past page 1, allowing the
            // bot to approve workflow changes hidden in big diffs.
            const SENSITIVE_PATTERNS = [
              /^\.github\/workflows\//,         // any CI / review workflow
              /^\.github\/dependabot\.ya?ml$/,  // dependency update config
              /^\.github\/CODEOWNERS$/,         // review-routing rules
              /^policy\//,                       // OPA / Rego policies
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const sensitiveFiles = files
              .map(f => f.filename)
              .filter(name => SENSITIVE_PATTERNS.some(p => p.test(name)));

            if (sensitiveFiles.length > 0) {
              const sample = sensitiveFiles.slice(0, 5).join(', ');
              const more = sensitiveFiles.length > 5 ? ` (+${sensitiveFiles.length - 5} more)` : '';
              console.log(`PR #${prNumber} touches sensitive paths — skipping auto-approve. Files: ${sample}${more}`);
              console.log('Sensitive-path changes require explicit human approval to prevent self-merge of CI / policy / review-routing config.');
              return;
            }

            console.log(`Approving PR #${prNumber} by org member ${author} after successful CI`);

            // Check if already approved by this specific bot
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const appApproval = reviews.find(
              r => r.state === 'APPROVED' &&
                   r.user.login === 'meshlogic-ci-dependency-access[bot]'
            );

            if (appApproval) {
              console.log('PR already approved by meshlogic-ci-dependency-access — skipping');
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'All CI checks passed. Auto-approved by meshlogic-ci-dependency-access.',
            });

            console.log(`PR #${prNumber} approved`);
