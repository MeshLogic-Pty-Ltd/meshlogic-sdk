name: Auto Approve PRs

# auto-approve.yml | version: v7 | last reviewed: 2026-05-03
#
# Operator audit one-liner:
#   gh api /repos/<owner>/<repo>/contents/.github/workflows/auto-approve.yml \
#     --jq '.content' | base64 -d | head -3
# yields the version + review date for any consumer repo.
#
# Triggers after the gating CI workflow(s) complete on a PR.
# Uses the meshlogic-ci-dependency-access GitHub App to approve,
# since the app is a distinct identity from the PR author.
#
# MAINTENANCE NOTE: the on.workflow_run.workflows array below uses
# the human-readable `name:` of each gating workflow (GitHub does
# not support file-path or ID matching here). If you rename a
# gating workflow, this trigger must be updated in the same PR or
# auto-approve will silently stop firing. Keep this list in sync
# with branch protection's required-checks list.
#
# SECURITY MODEL (v7 — bpUnreadable now correctly differentiates 404 (fallback OK) from 403 (privilege regression, hard fail)):
#
#   1. Approves only the exact SHA that CI validated (HIGH#1):
#      verifies pr.head.sha === workflow_run.head_sha. Prevents
#      bait-and-switch where author force-pushes between CI green
#      and auto-approve firing.
#
#   2. Concurrency keyed on workflow_run.id (HIGH#2): each run is
#      unique, so attacker-controlled head_branch can't cancel a
#      legitimate auto-approve via branch-name collision.
#
#   3. Author must be a public member of MeshLogic-Pty-Ltd org AND
#      have write+ permission on the repo (MED#3 — closes
#      outside-collaborator gap). Mirrors the canonical override
#      gate in meshlogic-agent/.github/workflows/ai-review.yml.
#
#   4. Verifies ALL required status checks (per branch protection)
#      are success on the validated SHA before approving (MED#4).
#      If branch protection has no required checks, falls back to
#      verifying the triggering workflow + AI Review are success.
#
#   5. Skips PRs touching sensitive paths (LOW#6 — extended set):
#      CI workflows, dependabot config, CODEOWNERS, OPA policy,
#      build-config (Cargo, package.json, go.mod, requirements.txt
#      etc.), composite actions, scripts, and signing/secrets
#      directories. Those changes require human approval to
#      prevent self-merge of supply-chain-relevant config.
on:
  workflow_run:
    workflows: ["Go SDK", "Python SDK", "TypeScript SDK"]
    types: [completed]

# v4 review MED#2: serialize on workflow_run.head_sha — that's the
# attacker-uncontrolled commit identifier (set by GitHub from the
# actual ref). Keying on workflow_run.id was effectively a no-op
# since each id is unique; head_sha lets us correctly serialize
# rapid CI re-runs against the same commit. Idempotency is also
# enforced at the createReview step (commit_id match).
concurrency:
  group: auto-approve-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-approve:
    name: Auto Approve (CI Passed)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.event.workflow_run.repository.full_name
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: MeshLogic-Pty-Ltd

      - name: Find and approve PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests;

            // v2 LOW#1 + v3 MED#5 + v4 LOW#1: helper declared as a
            // const arrow before the call site. Closes over `run`,
            // `github`, `context`, `core` from the enclosing scope
            // (consistent with how actions/github-script users
            // normally reference these — passing them as parameters
            // would be inconsistent with `github`/`context` access).
            //
            // v3 review note on forks: workflow_run.pull_requests is
            // ONLY populated for same-repo PRs by design. The job-
            // level `if:` already requires head_repository ==
            // repository for additional safety. Fork PRs never reach
            // this code; that's intentional — forks must always go
            // through human review. This is documented to prevent
            // a future maintainer from "fixing" the silent skip.
            const processPullRequest = async (prNumber) => {

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // HIGH#1: approve only the exact commit CI validated.
            // Without this, an author can push commit A → CI green →
            // push commit B → auto-approve fires on A's success but
            // the PR head is now B (which CI never saw).
            if (pr.head.sha !== run.head_sha) {
              console.log(`PR #${prNumber} head ${pr.head.sha.slice(0,7)} has advanced past validated SHA ${run.head_sha.slice(0,7)} — skipping auto-approve. A new CI run will trigger this workflow once it succeeds.`);
              return;
            }

            const author = pr.user.login;

            // MED#3 (a): write+ permission on this repo.
            try {
              const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              const allowed = ['admin', 'maintain', 'write'];
              if (!allowed.includes(perm.permission)) {
                console.log(`PR #${prNumber} author ${author} has '${perm.permission}' permission — skipping auto-approve`);
                return;
              }
            } catch (e) {
              console.log(`PR #${prNumber} — collaborator check failed for ${author} (HTTP ${e.status || 'unknown'}: ${e.message || 'no details'}). Skipping auto-approve.`);
              return;
            }

            // MED#3 (b): public membership in MeshLogic-Pty-Ltd org.
            // Closes the outside-collaborator gap: write+ alone would
            // accept outside collaborators; org-membership ensures
            // only MeshLogic-affiliated people are auto-approved.
            //
            // Uses checkPublicMembershipForUser (not Membership) since
            // the App token doesn't have org:read scope. Members with
            // private membership must make it public OR be approved
            // by a human reviewer.
            try {
              await github.rest.orgs.checkPublicMembershipForUser({
                org: 'MeshLogic-Pty-Ltd',
                username: author,
              });
            } catch (e) {
              console.log(`PR #${prNumber} author ${author} is not a public member of MeshLogic-Pty-Ltd (HTTP ${e.status || 'unknown'}). Make org membership public or request human approval.`);
              return;
            }

            // LOW#6 + v3 review MED#6: extended sensitive-path skip.
            // Paginated to catch sensitive files past the first 30
            // in large PRs.
            const SENSITIVE_PATTERNS = [
              // CI / review / governance config
              /^\.github\/workflows\//,
              /^\.github\/actions\//,
              /^\.github\/dependabot\.ya?ml$/,
              /^\.github\/renovate\.json5?$/,
              /^\.github\/CODEOWNERS$/,
              /^\.github\/[^\/]+\.ya?ml$/i,    // root .github/*.yml (auto-merge, label config, etc.) — case-insensitive
              // Submodule pointer changes (supply-chain attack vector)
              /^\.gitmodules$/,
              // Policy as code
              /^policy\//,
              // Dependency manifests (supply-chain vector)
              /^Cargo\.(toml|lock)$/,
              /^package(-lock)?\.json$/,
              /^yarn\.lock$/,
              /^pnpm-lock\.yaml$/,
              /^go\.(mod|sum)$/,
              /^(requirements[^/]*\.txt|Pipfile(\.lock)?|pyproject\.toml|poetry\.lock|uv\.lock)$/,
              /^Gemfile(\.lock)?$/,
              /^composer\.(json|lock)$/,
              /^flake\.(nix|lock)$/,
              // Container image manifests
              /(^|\/)Dockerfile[^\/]*$/,
              /^docker-compose[^\/]*\.ya?ml$/,
              /^\.dockerignore$/,
              // Build / release scripts
              /^scripts\//,
              /^Makefile$/,
              // Signing material / secrets directories
              // v4 review MED#1: tightened from the over-broad
              // /(^|\/)(signing|certs?|secrets?|keys?)(\/|\.)/ which
              // matched legitimate code paths like `secrets.json` (a
              // dependency-lock-style file in some repos) or any
              // `keys.txt`. Restrict to known top-level directory
              // names; rely on the file-extension list below for
              // catching loose secret files anywhere in the tree.
              /^(\.github\/)?(signing|secrets|keys|certs)\//i,
              /\.(pem|key|p12|pfx|cer|crt|asc|gpg)$/i,
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const sensitiveFiles = files
              .map(f => f.filename)
              .filter(name => SENSITIVE_PATTERNS.some(p => p.test(name)));

            if (sensitiveFiles.length > 0) {
              const sample = sensitiveFiles.slice(0, 5).join(', ');
              const more = sensitiveFiles.length > 5 ? ` (+${sensitiveFiles.length - 5} more)` : '';
              console.log(`PR #${prNumber} touches sensitive paths — skipping auto-approve. Files: ${sample}${more}`);
              console.log('Sensitive-path changes require explicit human approval to prevent self-merge of supply-chain-relevant config.');
              return;
            }

            // MED#4: verify ALL required status checks are success on
            // the validated SHA. Without this, auto-approve fires on
            // first-success of the triggering workflow even if other
            // required checks are still pending or failing — creating
            // a misleading approval signal (branch protection still
            // blocks merge, but the bot has weighed in prematurely).
            //
            // Reads BOTH the legacy `contexts` field AND the newer
            // ruleset/branch-protection-v2 `checks[].context` field
            // (v2 review MED#3): a repo migrated to rulesets may have
            // an empty contexts list and only populate checks[].
            // v5 review HIGH#2: gate on hadProtectionSignal (set
            // inside the try-block) rather than requiredChecks.length
            // (which is mutated downstream by the fallback). This way
            // any future refactor that reorders the fallback cannot
            // silently re-open the v3-MED#3 hole.
            let requiredChecks = [];
            let hadProtectionSignal = false;  // true ⇒ we successfully read BP
            let bpUnreadable = false;          // true ⇒ 403/404 on lookup
            try {
              const { data: protection } = await github.rest.repos.getBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: pr.base.ref,
              });
              const rsc = protection.required_status_checks;
              const legacy = rsc?.contexts ?? [];
              const modern = (rsc?.checks ?? []).map(c => c.context);
              requiredChecks = [...new Set([...legacy, ...modern])];
              hadProtectionSignal = true;
            } catch (e) {
              // v3 review MED#3 + v4 / v5 / v6 review recurring HIGH:
              // 404 and 403 mean different things and MUST be handled
              // differently:
              //   - 404 = no branch protection on this branch. The
              //     operator chose this state. Fallback gate (CI +
              //     AI Review) is the deliberate contract.
              //   - 403 = branch protection EXISTS but the App lost
              //     administration:read. This is a privilege
              //     regression. We have no idea what BP requires; we
              //     cannot enforce it. HARD FAIL — refuse to approve.
              //
              // Earlier iterations conflated the two and the gate
              // silently degraded. v7 fixes this once and for all.
              if (e.status === 403) {
                console.log(`Branch-protection lookup forbidden (403) on ${pr.base.ref}: ${e.message}. App may have lost administration:read; refusing to auto-approve.`);
                return;
              }
              if (e.status === 404) {
                bpUnreadable = true;
                console.log(`No branch protection on ${pr.base.ref} (404). Fallback gate (triggering workflow + AI Review) will apply.`);
              } else {
                console.log(`Branch-protection lookup failed (HTTP ${e.status}): ${e.message}. Skipping auto-approve out of caution.`);
                return;
              }
            }

            // v3 review HIGH#1: AI Review enforcement was previously
            // only added in the fallback (no-branch-protection) path.
            // For repos that DO have branch protection but don't list
            // AI Review as required, auto-approve would happily fire
            // while AI Review had flagged BLOCKING/HIGH findings. AI
            // Review is the security gate of last resort — require
            // it unconditionally. If a repo legitimately doesn't have
            // AI Review installed, this gate fails closed (the check
            // is "missing" → auto-approve skips → human review needed).
            //
            // v4 review HIGH#2 (partial): the literal name 'AI Review
            // Findings' is hardcoded. The reusable workflow posts
            // both a check-run AND a legacy commit status under this
            // name (see meshlogic-agent/.github/workflows/ai-review
            // .yml). If the upstream reusable workflow renames it,
            // this constant must be updated in lockstep.
            const AI_REVIEW_CHECK_NAME = 'AI Review Findings';
            if (requiredChecks.length === 0) {
              requiredChecks = [run.name];
            }
            requiredChecks = [...new Set([...requiredChecks, AI_REVIEW_CHECK_NAME])];

            // Fetch all check-runs + statuses on the validated SHA.
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: run.head_sha,
              per_page: 100,
            });
            const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: run.head_sha,
            });

            const checkOutcomes = new Map();
            for (const cr of checkRuns) {
              // success | failure | neutral | cancelled | skipped | timed_out | action_required | stale
              checkOutcomes.set(cr.name, cr.conclusion);
            }
            for (const s of combinedStatus.statuses) {
              checkOutcomes.set(s.context, s.state); // success | failure | error | pending
            }

            // v2 review LOW#2 + v3 review HIGH#2: only 'success' is
            // accepted as passing. We previously also accepted
            // 'neutral' (per GitHub's branch-protection semantics),
            // but for security-sensitive gates like AI Review,
            // 'neutral' often means the gate degraded (rate-limit,
            // missing API key, partial failure). Accepting it
            // creates a fail-open path. 'skipped' is dropped for the
            // same reason — an attacker who causes a path-filtered
            // required check to skip should not bypass approval.
            // 'error' and 'pending' are non-terminal/error states
            // and never accepted as passing.
            const PASSING = new Set(['success']);
            const failing = [];
            const missing = [];
            for (const required of requiredChecks) {
              const outcome = checkOutcomes.get(required);
              if (outcome === undefined || outcome === null) {
                missing.push(required);
              } else if (!PASSING.has(outcome)) {
                failing.push(`${required}=${outcome}`);
              }
            }

            if (missing.length > 0 || failing.length > 0) {
              if (missing.length > 0) console.log(`Required checks not yet reported on ${run.head_sha.slice(0,7)}: ${missing.join(', ')}`);
              if (failing.length > 0) console.log(`Required checks not green on ${run.head_sha.slice(0,7)}: ${failing.join(', ')}`);
              console.log('Skipping auto-approve until all required checks pass on the validated SHA.');
              return;
            }

            console.log(`Approving PR #${prNumber} by org member ${author} after all required checks green on ${run.head_sha.slice(0,7)}`);

            // Idempotency: don't double-approve.
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const appApproval = reviews.find(
              r => r.state === 'APPROVED' &&
                   r.user.login === 'meshlogic-ci-dependency-access[bot]' &&
                   r.commit_id === run.head_sha
            );

            if (appApproval) {
              console.log(`PR #${prNumber} already approved by meshlogic-ci-dependency-access for SHA ${run.head_sha.slice(0,7)} — skipping`);
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              commit_id: run.head_sha,
              event: 'APPROVE',
              body: `All required CI checks passed on ${run.head_sha.slice(0,7)}. Auto-approved by meshlogic-ci-dependency-access.`,
            });

            console.log(`PR #${prNumber} approved at SHA ${run.head_sha.slice(0,7)}`);

            };  // end processPullRequest

            if (!prs || prs.length === 0) {
              console.log('No PRs associated with this workflow run');
              return;
            }

            for (const prRef of prs) {
              try {
                await processPullRequest(prRef.number);
              } catch (e) {
                console.log(`PR #${prRef.number}: unexpected error during auto-approve evaluation — ${e.message}. Skipping.`);
              }
            }
